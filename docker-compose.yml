# Libra OS Stack — root compose file (core services only).
#
# Brings up Libra OS server + Postgres + SurrealDB. Companion apps under
# apps/<name>/ are independent compose files; layer one on top with:
#
#   docker compose -f docker-compose.yml -f apps/<name>/docker-compose.yaml up -d
#
# All services share the `nova-net` network. Companion compose files attach
# to it as `external: true` so service-to-service DNS works
# (e.g. LibreChat reaching `nova-os:8900`).

services:
  nova-os:
    image: ghcr.io/libraos/libraos:${NOVA_OS_VERSION:-v0.1.14}
    container_name: nova-os
    restart: unless-stopped
    ports:
      - "${NOVA_OS_PORT:-8900}:8900"
    # Linux memcg accounts EPOLLET items against RLIMIT_MEMLOCK (default 64 KiB)
    # and Go's netpoll uses EPOLLET for every fd. Vanilla Docker hosts without
    # systemd `LimitMEMLOCK=infinity` tuning will fail to start nova-os without
    # this ulimit override. Eval template (docker-compose.eval.yaml) has the
    # same line for the same reason.
    ulimits:
      memlock: -1
    environment:
      - NOVA_OS_PORT=8900
      - "NOVA_OS_PUBLIC_URL=${NOVA_OS_PUBLIC_URL:?required - public URL Libra OS is reachable at, e.g. https://nova-os.example.com}"
      - "NOVA_OS_ADMIN_EMAIL=${NOVA_OS_ADMIN_EMAIL:?required - initial admin email}"
      - "NOVA_OS_ADMIN_PASSWORD=${NOVA_OS_ADMIN_PASSWORD:?required - initial admin password, >= 12 chars}"
      - "NOVA_OS_JWT_SECRET=${NOVA_OS_JWT_SECRET:?required - generate with openssl rand -hex 32}"
      - "NOVA_OS_DATABASE_URL=postgresql://nova:${POSTGRES_PASSWORD:?required - generate with openssl rand -hex 32}@postgres:5432/nova_os"
      - NOVA_OS_SURREAL_URL=ws://surrealdb:8000/rpc
      - NOVA_OS_APPS_ROOT=${NOVA_OS_APPS_ROOT:-/var/nova-os/apps}
      - NOVA_OS_INTEGRATION_KEY=${NOVA_OS_INTEGRATION_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - MEGANOVA_CLOUD_KEY=${MEGANOVA_CLOUD_KEY:-${MEGANOVA_API_KEY:-}}
      - MEGANOVA_CLOUD_URL=${MEGANOVA_CLOUD_URL:-${MEGANOVA_BASE_URL:-}}
      # Optional companion-app wiring — uncomment in .env to activate.
      - SEARXNG_URL=${SEARXNG_URL:-}
      - CRAWL4AI_URL=${CRAWL4AI_URL:-}
      - DOCLING_URL=${DOCLING_URL:-}
    volumes:
      - nova-data:/data
      # Multi-app primitive (v0.1.7+): mount a persistent volume at the
      # apps root so installed apps survive container restarts. Without
      # this mount, anything installed via `nova-os apps install` or
      # /admin/apps.html lands in ephemeral container storage and is
      # wiped on every `docker compose down/up`.
      - nova-apps:/var/nova-os/apps
    depends_on:
      postgres:
        condition: service_healthy
      surrealdb:
        # service_healthy, not service_started (libraos/libraos#1282).
        # Knowledge-store selection is ONE-SHOT at boot: if the kernel wins
        # the race against a still-starting SurrealDB it silently falls back
        # to a lexical-only store for the whole process lifetime, with no
        # retry — the KB then answers from keyword matching while the
        # deployment believes it has semantic search.
        condition: service_healthy
    networks:
      - nova-net

  postgres:
    image: postgres:16-alpine
    container_name: nova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nova_os
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required - generate with openssl rand -hex 32}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova_os"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nova-net

  surrealdb:
    # Pinned by digest, not the floating :v3 (libraos/libraos#1282).
    # Upstream moves that pointer: on 2026-09-01 they re-pointed v3 to 3.1.6,
    # a month AFTER 3.2.4 shipped, while `latest` stayed on 3.2.4. A
    # `docker compose pull` on a floating tag can therefore change the
    # datastore version under a running deployment that has data on disk.
    # This digest is what :v3 already resolved to, so it is a freeze rather
    # than an upgrade, and it is the OCI image INDEX digest so amd64 and
    # arm64 both resolve.
    image: surrealdb/surrealdb:v3.1.6@sha256:ea7c472e5c971cee1ceb601fc8301f6b6b10edb5988adc53f33b416be3d8dc63
    container_name: nova-surrealdb
    restart: unless-stopped
    command: start --user root --pass ${SURREAL_PASSWORD:-root} file:/data/database.db
    volumes:
      - surreal-data:/data
    # EXEC form is required: the image has no /bin/sh, so a shell-form
    # healthcheck (a bare `test:` string, or CMD-SHELL) dies with
    #   exec: "/bin/sh": stat /bin/sh: no such file or directory
    # and the container reports unhealthy forever while serving fine.
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "ws://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nova-net

networks:
  nova-net:
    name: nova-net
    driver: bridge

volumes:
  nova-data:
  nova-apps:
  pg-data:
  surreal-data:
